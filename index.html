<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free WhatsApp Invoice & Bill Generator</title>
    <meta name="description" content="मुफ्त व्हाट्सएप बिल और इनवॉइस बनाएं। लोगो जोड़ें और PDF डाउनलोड करें।">
    <meta name="keywords" content="WhatsApp Bill Generator, Invoice Maker, Free PDF Bill">
    <meta name="robots" content="index, follow">

    <!-- html2pdf Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px 10px; }
        .card { background: #ffffff; padding: 25px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.3); width: 100%; max-width: 500px; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h2 { color: #075e54; font-size: 24px; margin-bottom: 5px; }
        .header p { color: #666; font-size: 13px; }

        .input-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; color: #333; margin-bottom: 5px; font-size: 14px; }
        input, textarea { width: 100%; padding: 10px 12px; border: 2px solid #e1e1e1; border-radius: 8px; font-size: 14px; outline: none; transition: 0.3s; }
        input:focus, textarea:focus { border-color: #25d366; }

        .btn-wa { width: 100%; background: linear-gradient(135deg, #25d366, #128c7e); color: white; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px; }
        .btn-pdf { width: 100%; background: linear-gradient(135deg, #007bff, #0056b3); color: white; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px; }

        /* Hidden Printable Container for Perfect PDF */
        #pdf-render-area {
            position: absolute;
            left: -9999px;
            top: -9999px;
            width: 750px;
            background: #ffffff;
            padding: 40px;
            box-sizing: border-box;
            color: #333;
        }

        .pdf-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #25d366; padding-bottom: 15px; margin-bottom: 20px; }
        .pdf-logo { max-width: 120px; max-height: 80px; object-fit: contain; }
        .pdf-title { text-align: right; }
        .pdf-title h1 { color: #075e54; font-size: 28px; margin: 0; }
        .pdf-title p { color: #666; font-size: 14px; margin: 0; }

        .pdf-details { margin-bottom: 25px; font-size: 15px; line-height: 1.6; }
        
        .pdf-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        .pdf-table th, .pdf-table td { border: 1px solid #ddd; padding: 10px 12px; text-align: left; font-size: 14px; }
        .pdf-table th { background-color: #f2f2f2; color: #075e54; }

        .pdf-total { text-align: right; font-size: 18px; font-weight: bold; color: #075e54; margin-top: 15px; }
        .pdf-footer { margin-top: 40px; text-align: center; font-size: 12px; color: #777; border-top: 1px solid #eee; padding-top: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <h2>📲 WhatsApp Bill & PDF Maker</h2>
            <p>लोगो जोड़ें और प्रोफेशनल बिल बनाएं</p>
        </div>

        <div class="input-group">
            <label>🖼️ दुकान/बिज़नेस का लोगो (Logo Choose करें):</label>
            <input type="file" id="logoInput" accept="image/*" onchange="loadLogo(event)">
        </div>

        <div class="input-group">
            <label>🏪 दुकान का नाम:</label>
            <input type="text" id="shopName" placeholder="उदा. गुप्ता जनरल स्टोर">
        </div>

        <div class="input-group">
            <label>👤 ग्राहक का नाम:</label>
            <input type="text" id="custName" placeholder="उदा. राहुल शर्मा जी">
        </div>

        <div class="input-group">
            <label>📦 सामान की जानकारी (Items):</label>
            <textarea id="items" rows="3" placeholder="उदा. 1 kg rice - 60&#10;2L oil - 240"></textarea>
        </div>

        <div class="input-group">
            <label>💰 कुल राशि (Total Amount ₹):</label>
            <input type="number" id="total" placeholder="उदा. 300">
        </div>

        <button class="btn-wa" onclick="sendWhatsApp()">WhatsApp पर भेजें</button>
        <button class="btn-pdf" onclick="generatePDF()">📄 PDF डाउनलोड करें</button>
    </div>

    <!-- HTML Hidden Container for PDF Rendering -->
    <div id="pdf-render-area">
        <div class="pdf-header">
            <div>
                <img id="pdf-logo-img" class="pdf-logo" src="" style="display:none;" alt="Logo">
            </div>
            <div class="pdf-title">
                <h1 id="pdf-shop-title">INVOICE</h1>
                <p>Date: <span id="pdf-date"></span></p>
            </div>
        </div>

        <div class="pdf-details">
            <strong>Customer Name:</strong> <span id="pdf-cust-name"></span>
        </div>

        <table class="pdf-table">
            <thead>
                <tr>
                    <th>Items / Particulars</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td id="pdf-items-list" style="white-space: pre-line;"></td>
                </tr>
            </tbody>
        </table>

        <div class="pdf-total">
            Total Amount: ₹<span id="pdf-total-amt"></span>
        </div>

        <div class="pdf-footer">
            Thank you for your business!
        </div>
    </div>

    <script>
        let logoBase64 = "";

        function loadLogo(event) {
            const reader = new FileReader();
            reader.onload = function() {
                logoBase64 = reader.result;
                const imgElement = document.getElementById('pdf-logo-img');
                imgElement.src = logoBase64;
                imgElement.style.display = 'block';
            };
            if(event.target.files[0]) {
                reader.readAsDataURL(event.target.files[0]);
            }
        }

        function sendWhatsApp() {
            let shop = document.getElementById('shopName').value || "Our Shop";
            let cust = document.getElementById('custName').value || "Customer";
            let items = document.getElementById('items').value || "N/A";
            let total = document.getElementById('total').value || "0";

            let msg = `*${shop}*%0A%0A*Customer:* ${cust}%0A*Items:*%0A${items}%0A%0A*Total Amount:* ₹${total}%0A%0AThank you!`;
            window.open(`https://api.whatsapp.com/send?text=${msg}`, '_blank');
        }

        function generatePDF() {
            let shop = document.getElementById('shopName').value || "INVOICE";
            let cust = document.getElementById('custName').value || "N/A";
            let items = document.getElementById('items').value || "N/A";
            let total = document.getElementById('total').value || "0";

            document.getElementById('pdf-shop-title').innerText = shop;
            document.getElementById('pdf-cust-name').innerText = cust;
            document.getElementById('pdf-items-list').innerText = items;
            document.getElementById('pdf-total-amt').innerText = total;

            const today = new Date();
            document.getElementById('pdf-date').innerText = today.toLocaleDateString('en-IN');

            const element = document.getElementById('pdf-render-area');

            const opt = {
                margin:       [10, 10, 10, 10],
                filename:     `${shop.replace(/\s+/g, '_')}_Invoice.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).save();
        }
    </script>
</body>
</html>
