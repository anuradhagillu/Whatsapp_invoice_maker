<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Billing System</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- html2pdf Library for Generating PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --secondary: #10b981;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 12px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px dashed var(--border);
        }

        .header h1 {
            font-size: 1.4rem;
            color: var(--primary);
            font-weight: 700;
        }

        .search-box-card {
            background: #eef2ff;
            padding: 14px;
            border-radius: 12px;
            border: 1px dashed #6366f1;
            margin-bottom: 20px;
        }

        .search-box-card label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            color: #4f46e5;
            margin-bottom: 8px;
        }

        .search-row {
            display: flex;
            gap: 8px;
        }

        .section-title {
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
            background: #f8fafc;
        }

        input:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .items-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .items-table th {
            text-align: left;
            font-size: 0.75rem;
            padding: 8px 4px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
        }

        .items-table td {
            padding: 6px 2px;
        }

        .item-row input {
            padding: 8px;
            font-size: 0.85rem;
        }

        .btn-remove {
            background: #fee2e2;
            color: #ef4444;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-add {
            background: #e0e7ff;
            color: var(--primary);
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-clear {
            background: #fee2e2;
            color: #dc2626;
            border: 1px solid #fca5a5;
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .action-buttons-group {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            margin-bottom: 20px;
        }

        .total-card {
            background: #f1f5f9;
            padding: 16px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .total-card span {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .total-card #displayTotal {
            font-size: 1.4rem;
            color: var(--secondary);
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-action {
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: white;
            transition: transform 0.1s;
        }

        .btn-action:active {
            transform: scale(0.98);
        }

        .btn-whatsapp {
            background: #25d366;
        }

        .btn-pdf {
            background: var(--primary);
        }

        /* Printable / PDF Styling */
        #printableArea {
            display: none;
        }

        @media print {
            body * {
                visibility: hidden;
            }
            #printableArea, #printableArea * {
                visibility: visible;
            }
            #printableArea {
                display: block;
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <h1><i class="fa-solid fa-file-invoice"></i> Quick Invoice Generator</h1>
        </div>

        <!-- 🔍 SEARCH OLD BILL FEATURE -->
        <div class="search-box-card">
            <label><i class="fa-solid fa-magnifying-glass"></i> Search Old Invoice / पुराना बिल खोजें</label>
            <div class="search-row">
                <input type="number" id="searchBillNo" placeholder="Enter Bill No (e.g. 2)">
                <button type="button" onclick="loadOldBill()" style="background: #4f46e5; color: white; border: none; padding: 0 16px; border-radius: 8px; font-weight: bold; cursor: pointer;">Search</button>
            </div>
        </div>

        <form id="invoiceForm">
            <!-- SHOP DETAILS -->
            <div class="section-title"><i class="fa-solid fa-store"></i> Shop Details</div>
            <div class="grid-2">
                <div class="input-group">
                    <label>Shop Name</label>
                    <input type="text" id="shopName" value="My Store">
                </div>
                <div class="input-group">
                    <label>Shop Phone</label>
                    <input type="tel" id="shopPhone" value="9876543210">
                </div>
            </div>

            <!-- INVOICE META -->
            <div class="grid-2">
                <div class="input-group">
                    <label>Invoice No.</label>
                    <input type="text" id="billNo" value="1">
                </div>
                <div class="input-group">
                    <label>Date & Time</label>
                    <input type="text" id="billDateTime" readonly>
                </div>
            </div>

            <!-- CUSTOMER DETAILS -->
            <div class="section-title" style="margin-top: 10px;"><i class="fa-solid fa-user"></i> Customer Details</div>
            <div class="grid-2">
                <div class="input-group">
                    <label>Customer Name</label>
                    <input type="text" id="custName" placeholder="Rahul Sharma">
                </div>
                <div class="input-group">
                    <label>WhatsApp Phone</label>
                    <input type="tel" id="custPhone" placeholder="91XXXXXXXXXX">
                </div>
            </div>

            <!-- ITEMS TABLE -->
            <div class="section-title" style="margin-top: 10px;"><i class="fa-solid fa-list-check"></i> Item List</div>
            <table class="items-table">
                <thead>
                    <tr>
                        <th style="width: 8%;">S.N</th>
                        <th style="width: 42%;">Item Description</th>
                        <th style="width: 15%;">Qty</th>
                        <th style="width: 17%;">Rate</th>
                        <th style="width: 18%;">Total</th>
                        <th style="width: 5%;"></th>
                    </tr>
                </thead>
                <tbody id="itemRowsContainer">
                    <!-- Dynamic Rows Will Appear Here -->
                </tbody>
            </table>

            <div class="action-buttons-group">
                <button type="button" class="btn-add" onclick="addItemRow()"><i class="fa-solid fa-plus"></i> Add Item</button>
                <button type="button" class="btn-clear" onclick="clearAllForm()"><i class="fa-solid fa-trash-can"></i> Clear All</button>
            </div>

            <!-- TOTAL DISPLAY -->
            <div class="total-card">
                <span>Grand Total:</span>
                <span>₹<span id="displayTotal">0</span></span>
            </div>

            <!-- ACTION BUTTONS -->
            <div class="btn-group">
                <button type="button" class="btn-action btn-whatsapp" onclick="sendWhatsApp()"><i class="fa-brands fa-whatsapp"></i> WhatsApp</button>
                <button type="button" class="btn-action btn-pdf" onclick="downloadPDF()"><i class="fa-solid fa-file-pdf"></i> Save PDF</button>
            </div>
        </form>
    </div>

    <!-- INVISIBLE PRINT AREA FOR PDF GENERATION -->
    <div id="printableArea"></div>

    <script>
        // Automatic Date & Time Setting
        window.onload = function() {
            const now = new Date();
            const formatted = now.toLocaleDateString('en-IN') + ' ' + now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('billDateTime').value = formatted;
            addItemRow(); // First default item row
        };

        // Add New Item Row
        function addItemRow() {
            const container = document.getElementById('itemRowsContainer');
            const rowCount = container.children.length + 1;
            const tr = document.createElement('tr');
            tr.className = 'item-row';
            tr.innerHTML = `
                <td style="font-weight:700; text-align:center; color:#64748b;" class="sn-cell">${rowCount}</td>
                <td><input type="text" class="item-desc" placeholder="Item Name" oninput="calculateRowTotal(this)"></td>
                <td><input type="number" class="item-qty" value="1" min="1" oninput="calculateRowTotal(this)"></td>
                <td><input type="number" class="item-rate" placeholder="0" oninput="calculateRowTotal(this)"></td>
                <td><input type="number" class="item-total" value="0" readonly style="background:#f1f5f9; font-weight:bold; color:#10b981;"></td>
                <td><button type="button" class="btn-remove" onclick="removeItemRow(this)"><i class="fa-solid fa-xmark"></i></button></td>
            `;
            container.appendChild(tr);
            updateSerialNumbers();
        }

        // Remove Item Row
        function removeItemRow(btn) {
            const container = document.getElementById('itemRowsContainer');
            if (container.children.length > 1) {
                btn.closest('tr').remove();
                updateSerialNumbers();
                calculateGrandTotal();
            } else {
                alert("कम से कम एक आइटम का होना अनिवार्य है!");
            }
        }

        // Update Serial Numbers
        function updateSerialNumbers() {
            const rows = document.querySelectorAll('.item-row');
            rows.forEach((row, index) => {
                row.querySelector('.sn-cell').innerText = index + 1;
            });
        }

        // Calculate Row Total
        function calculateRowTotal(element) {
            const row = element.closest('tr');
            const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
            const rate = parseFloat(row.querySelector('.item-rate').value) || 0;
            const total = qty * rate;
            row.querySelector('.item-total').value = total.toFixed(2);
            calculateGrandTotal();
        }

        // Calculate Grand Total
        function calculateGrandTotal() {
            let grandTotal = 0;
            const totals = document.querySelectorAll('.item-total');
            totals.forEach(input => {
                grandTotal += parseFloat(input.value) || 0;
            });
            document.getElementById('displayTotal').innerText = grandTotal.toFixed(2);
        }

        // Get Form Data Array
        function getItemsData() {
            const items = [];
            document.querySelectorAll('.item-row').forEach(row => {
                const desc = row.querySelector('.item-desc').value.trim();
                const qty = row.querySelector('.item-qty').value;
                const rate = row.querySelector('.item-rate').value;
                const total = row.querySelector('.item-total').value;
                if(desc !== "") {
                    items.push({ desc, qty, rate, total });
                }
            });
            return items;
        }

        // 💾 SAVE BILL TO HISTORY (LOCALSTORAGE)
        function saveBillToHistory() {
            let billNo = document.getElementById('billNo').value;
            let dateTime = document.getElementById('billDateTime').value;
            let shop = document.getElementById('shopName').value;
            let shopPhone = document.getElementById('shopPhone').value;
            let cust = document.getElementById('custName').value;
            let custPhone = document.getElementById('custPhone').value;
            let items = getItemsData();
            let total = document.getElementById('displayTotal').innerText;

            let billData = { billNo, dateTime, shop, shopPhone, cust, custPhone, items, total };

            let history = JSON.parse(localStorage.getItem('invoice_history') || '{}');
            history[billNo] = billData;
            localStorage.setItem('invoice_history', JSON.stringify(history));
        }

        // 🔍 LOAD OLD BILL FROM HISTORY
        function loadOldBill() {
            let searchNo = document.getElementById('searchBillNo').value;
            if (!searchNo) {
                alert("कृपया बिल नंबर दर्ज करें!");
                return;
            }

            let history = JSON.parse(localStorage.getItem('invoice_history') || '{}');
            let billData = history[searchNo];

            if (!billData) {
                alert("बिल नंबर #" + searchNo + " का कोई रिकॉर्ड नहीं मिला!");
                return;
            }

            document.getElementById('billNo').value = billData.billNo;
            document.getElementById('billDateTime').value = billData.dateTime;
            document.getElementById('shopName').value = billData.shop;
            document.getElementById('shopPhone').value = billData.shopPhone;
            document.getElementById('custName').value = billData.cust;
            document.getElementById('custPhone').value = billData.custPhone;

            const container = document.getElementById('itemRowsContainer');
            container.innerHTML = "";

            billData.items.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.className = 'item-row';
                tr.innerHTML = `
                    <td style="font-weight:700; text-align:center; color:#64748b;" class="sn-cell">${index + 1}</td>
                    <td><input type="text" class="item-desc" value="${item.desc}" oninput="calculateRowTotal(this)"></td>
                    <td><input type="number" class="item-qty" value="${item.qty}" min="1" oninput="calculateRowTotal(this)"></td>
                    <td><input type="number" class="item-rate" value="${item.rate}" oninput="calculateRowTotal(this)"></td>
                    <td><input type="number" class="item-total" value="${item.total}" readonly style="background:#f1f5f9; font-weight:bold; color:#10b981;"></td>
                    <td><button type="button" class="btn-remove" onclick="removeItemRow(this)"><i class="fa-solid fa-xmark"></i></button></td>
                `;
                container.appendChild(tr);
            });

            calculateGrandTotal();
            alert("बिल #" + searchNo + " लोड हो गया है!");
        }

        // 🧹 CLEAR ALL FORM
        function clearAllForm() {
            if (confirm("क्या आप पूरा फॉर्म खाली करना चाहते हैं?")) {
                document.getElementById('custName').value = "";
                document.getElementById('custPhone').value = "";
                
                const container = document.getElementById('itemRowsContainer');
                container.innerHTML = "";
                addItemRow();

                document.getElementById('displayTotal').innerText = "0";
            }
        }

        // 📲 WHATSAPP SHARE
        function sendWhatsApp() {
            saveBillToHistory(); // Auto-save

            const shop = document.getElementById('shopName').value;
            const shopPhone = document.getElementById('shopPhone').value;
            const billNo = document.getElementById('billNo').value;
            const custName = document.getElementById('custName').value;
            const custPhone = document.getElementById('custPhone').value;
            const total = document.getElementById('displayTotal').innerText;
            const items = getItemsData();

            if (!custPhone) {
                alert("कृपया ग्राहक का WhatsApp नंबर दर्ज करें!");
                return;
            }

            let msg = `🧾 *INVOICE: #${billNo}*\n`;
            msg += `🏪 *${shop}*\n📞 Ph: ${shopPhone}\n`;
            msg += `--------------------------------\n`;
            msg += `👤 *Customer:* ${custName || 'Valued Customer'}\n`;
            msg += `--------------------------------\n`;
            msg += `*ITEMS PURCHASED:*\n\n`;

            items.forEach((item, i) => {
                msg += `${i+1}. *${item.desc}*\n   ${item.qty} x ₹${item.rate} = *₹${item.total}*\n`;
            });

            msg += `--------------------------------\n`;
            msg += `💰 *GRAND TOTAL: ₹${total}*\n`;
            msg += `--------------------------------\n`;
            msg += `Thank you for shopping with us! 🙏`;

            let cleanPhone = custPhone.replace(/[^0-9]/g, '');
            if(cleanPhone.length === 10) cleanPhone = '91' + cleanPhone;

            const url = `https://wa.me/${cleanPhone}?text=${encodeURIComponent(msg)}`;
            window.open(url, '_blank');
        }

        // 📄 DOWNLOAD PDF
        function downloadPDF() {
            saveBillToHistory(); // Auto-save

            const shop = document.getElementById('shopName').value;
            const shopPhone = document.getElementById('shopPhone').value;
            const billNo = document.getElementById('billNo').value;
            const dateTime = document.getElementById('billDateTime').value;
            const custName = document.getElementById('custName').value;
            const custPhone = document.getElementById('custPhone').value;
            const total = document.getElementById('displayTotal').innerText;
            const items = getItemsData();

            let itemsHtml = items.map((item, index) => `
                <tr style="border-bottom: 1px solid #eee;">
                    <td style="padding: 8px; text-align: center;">${index + 1}</td>
                    <td style="padding: 8px;">${item.desc}</td>
                    <td style="padding: 8px; text-align: center;">${item.qty}</td>
                    <td style="padding: 8px; text-align: right;">₹${item.rate}</td>
                    <td style="padding: 8px; text-align: right; font-weight: bold;">₹${item.total}</td>
                </tr>
            `).join('');

            const pdfTemplate = `
                <div style="padding: 30px; font-family: sans-serif; color: #333;">
                    <div style="display: flex; justify-content: space-between; border-bottom: 2px solid #4f46e5; padding-bottom: 15px;">
                        <div>
                            <h2 style="color: #4f46e5; margin: 0;">${shop}</h2>
                            <p style="margin: 4px 0; color: #666;">Phone: ${shopPhone}</p>
                        </div>
                        <div style="text-align: right;">
                            <h3 style="margin: 0; color: #333;">INVOICE</h3>
                            <p style="margin: 4px 0; color: #666;">#${billNo}</p>
                            <p style="margin: 0; color: #666; font-size: 12px;">${dateTime}</p>
                        </div>
                    </div>

                    <div style="margin: 20px 0; background: #f8fafc; padding: 12px; border-radius: 8px;">
                        <strong>Billed To:</strong><br>
                        ${custName || 'Valued Customer'}<br>
                        ${custPhone}
                    </div>

                    <table style="width: 100%; border-collapse: collapse; margin-top: 10px;">
                        <thead>
                            <tr style="background: #4f46e5; color: white;">
                                <th style="padding: 8px;">#</th>
                                <th style="padding: 8px; text-align: left;">Item</th>
                                <th style="padding: 8px;">Qty</th>
                                <th style="padding: 8px; text-align: right;">Rate</th>
                                <th style="padding: 8px; text-align: right;">Total</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${itemsHtml}
                        </tbody>
                    </table>

                    <div style="text-align: right; margin-top: 20px; font-size: 18px; font-weight: bold; color: #10b981;">
                        Grand Total: ₹${total}
                    </div>

                    <div style="text-align: center; margin-top: 40px; color: #888; font-size: 12px; border-top: 1px solid #eee; padding-top: 10px;">
                        Thank you for your business!
                    </div>
                </div>
            `;

            const element = document.getElementById('printableArea');
            element.innerHTML = pdfTemplate;

            const opt = {
                margin:       0.5,
                filename:     `Invoice_#${billNo}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).save();
        }
    </script>
</body>
</html>
